<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head><body><div id="status">読み込み中...</div><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><script>
var el=document.getElementById('status');
var LIFF_ID="2007938100-lN5KikAU";
var FORM_BASE="https://docs.google.com/forms/d/e/1FAIpQLScwaOuRQwRQ5T8iEC3zNgb4Xqhg8emT9pluh0dXBP3TXrK8Xw/viewform";
var ENTRY_ID="entry.1521261425";
var done=false;
setTimeout(function(){if(!done){el.innerText='読み込みに時間がかかっています。LINEアプリからこのリンクを開き直してください。';}},8000);
liff.init({liffId:LIFF_ID}).then(function(){
  done=true;
  if(!liff.isLoggedIn()){
    el.innerText='ログインしていません。LINEアプリからこのリンクを開いてください。';
    return null;
  }
  return liff.getProfile();
}).then(function(profile){
  if(!profile) return;
  var url = FORM_BASE + '?usp=pp_url&' + ENTRY_ID + '=' + encodeURIComponent(profile.userId);
  window.location.href = url;
}).catch(function(err){
  done=true;
  el.innerText='エラー: '+(err&&err.message?err.message:err);
});
</script></body></html>
